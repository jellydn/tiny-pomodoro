name: Build iOS Simulator App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PomodoroTimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build simulator app (unsigned, no Apple account needed)
        run: |
          xcodebuild \
            -workspace ios/TinyPomodoro.xcworkspace \
            -scheme TinyPomodoro \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app into zip
        run: |
          APP="build/Build/Products/Release-iphonesimulator/TinyPomodoro.app"
          test -d "$APP" && echo "found $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip"
          ls -la "PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip
          body: |
            ## PomodoroTimer v${{ steps.version.outputs.VERSION }}

            ### Download
            - **Android APK**: build via the Build Android APK workflow
            - **iOS Simulator app**: attached zip — unsigned simulator build, **no Apple Developer account required**

            ### Run the iOS app (requires Apple Silicon Mac)
            1. Download and unzip `PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip`
            2. Open the Simulator: `open -a Simulator`
            3. Install: `xcrun simctl install booted <path>/TinyPomodoro.app`
            4. Launch: `xcrun simctl launch booted com.pomodorotimer.app`

            **Note:** This is a simulator build (arm64). It runs on Apple Silicon Macs in the iOS Simulator and cannot be installed on a physical iPhone — that requires Apple's signing (paid account or a local free personal team).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload simulator app artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip
          path: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}-ios-simulator.zip
