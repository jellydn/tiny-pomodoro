name: Build Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write

# EAS Build free tier allows only ONE concurrent build. The Android and iOS
# workflows submit to the same EAS account from the same tag push, so serialize
# them here (Actions-level queue) instead of hitting EAS concurrently and
# having one build rejected.
concurrency:
  group: eas-native-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      # Local composite actions (./.github/actions/*) can only be loaded once
      # the repository is on disk — checkout must come first.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch runs on a branch ref (no tag) — use a safe,
            # slash-free version instead of the raw ref.
            echo "VERSION=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android Release APK
        id: build
        working-directory: PomodoroTimer
        run: |
          # preview profile builds a standalone release APK (buildType: apk).
          # The --json output lets us capture the exact build ID so we can
          # download THIS build, not whatever build:list happens to return.
          # The eas-cli package exposes a single binary named `eas` (verified:
          # bin: { eas: bin/run }). It is installed globally by the setup
          # action and resolved via PATH. Invoking `eas` directly avoids npx,
          # which neither scans PATH for global bins nor has a bin matching
          # the package name, and would re-download the CLI from the registry.
          set +e
          eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
          EAS_EXIT=$?
          set -e
          if [ $EAS_EXIT -ne 0 ]; then
            # Surface the EAS-side failure reason in CI logs so a failed build
            # is diagnosable without logging into the Expo dashboard.
            echo "::group::EAS build failure detail"
            cat build-result.json 2>/dev/null || true
            eas build:list --platform android --profile preview --limit 2 --json 2>/dev/null \
              | jq -r '.[] | "\(.id) status=\(.status) error=\(.error // \"none\")"' 2>/dev/null || true
            echo "::endgroup::"
            exit $EAS_EXIT
          fi
          # `eas build --json` prints an ARRAY of builds, so index [0].
          BUILD_ID=$(jq -r '.[0].id // empty' build-result.json)
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Built with ID: $BUILD_ID"

      - name: Download APK from EAS
        uses: ./.github/actions/eas-download
        with:
          platform: android
          profile: preview
          build_id: ${{ steps.build.outputs.BUILD_ID }}
          output_file: PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
          expo_token: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
          body: |
            ## PomodoroTimer v${{ steps.version.outputs.VERSION }}

            ### Download
            - **Android APK**: Download the attached APK file (free, sideloadable — no Play Store needed)

            ### Installation (Android)
            1. Download the APK file
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK to install

            ### iOS / Web (free options — no Apple Developer account needed)
            - **Web app**: https://jellydn.github.io/tiny-pomodoro/ (works in any browser)
            - **iOS Simulator build**: attached to the iOS release or build locally with Xcode (see README)
            - **iPhone sideloading**: use AltStore / Sideloadly with a free Apple ID (refreshed every 7 days)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
          path: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
