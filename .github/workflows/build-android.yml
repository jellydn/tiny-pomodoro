name: Build Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PomodoroTimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Setup EAS CLI
        run: bun add -g eas-cli

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # preview profile builds a standalone release APK (buildType: apk).
          # The --json output lets us capture the exact build ID so we can
          # download THIS build, not whatever build:list happens to return.
          npx eas-cli build --platform android --profile preview --non-interactive --wait --json > build-result.json
          BUILD_ID=$(jq -r '.id // empty' build-result.json)
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Built with ID: $BUILD_ID"

      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "${{ steps.build.outputs.BUILD_ID }}" ]; then
            BUILD_URL=$(npx eas-cli build:view "${{ steps.build.outputs.BUILD_ID }}" --json 2>/dev/null | jq -r '.artifacts.buildUrl // empty')
          fi
          if [ -z "$BUILD_URL" ]; then
            # Fallback: most recent finished preview build for Android.
            BUILD_URL=$(npx eas-cli build:list --platform android --profile preview --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl // empty')
          fi
          if [ -z "$BUILD_URL" ]; then
            echo "::error::Could not resolve EAS artifact URL"
            exit 1
          fi
          curl -L -o PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk "$BUILD_URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
          body: |
            ## PomodoroTimer v${{ steps.version.outputs.VERSION }}

            ### Download
            - **Android APK**: Download the attached APK file (free, sideloadable — no Play Store needed)

            ### Installation (Android)
            1. Download the APK file
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK to install

            ### iOS / Web (free options — no Apple Developer account needed)
            - **Web app**: https://jellydn.github.io/tiny-pomodoro/ (works in any browser)
            - **iOS Simulator build**: attached to the iOS release or build locally with Xcode (see README)
            - **iPhone sideloading**: use AltStore / Sideloadly with a free Apple ID (refreshed every 7 days)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
          path: PomodoroTimer/PomodoroTimer-${{ steps.version.outputs.VERSION }}.apk
