name: Deploy Web PWA

# Free, universal distribution: the app exports to a static web app that runs
# in any browser on any device — no Apple Developer account, no app store.
# Deploys to GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Export web build
        working-directory: PomodoroTimer
        run: npx expo export --platform web

      - name: Rewrite asset paths for GitHub Pages subpath
        working-directory: PomodoroTimer
        run: |
          # expo export emits absolute paths (/favicon.ico, /_expo/...), which
          # break when Pages serves the site under /<repo>/. Rewrite to
          # relative paths so the PWA works at any base URL.
          sed -i 's|href="/|href="./|g; s|src="/|src="./|g' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: PomodoroTimer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
