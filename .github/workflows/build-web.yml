name: Deploy Web PWA

# Free, universal distribution: export the app as static files and deploy them
# to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PomodoroTimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Export web build
        env:
          # GitHub Pages hosts this repository below /tiny-pomodoro/.
          EXPO_BASE_URL: /tiny-pomodoro
        run: npx expo export --platform web

      - name: Copy PWA assets into export
        run: |
          # Expo uses public/index.html as its HTML template, but does not
          # copy arbitrary public files into the export. Preserve the generated
          # index.html and copy the installability assets explicitly.
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js
          cp -R public/icons dist/icons

      - name: Validate static PWA files
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/favicon.ico
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
          grep -q 'manifest.json' dist/index.html
          grep -q 'sw.js' dist/index.html
          grep -q '"start_url": "."' dist/manifest.json
          grep -q '"scope": "."' dist/manifest.json
          grep -q '/tiny-pomodoro/_expo/' dist/index.html
          node -e "const m=require('./dist/manifest.json'); if (m.start_url !== '.' || m.scope !== '.') process.exit(1)"
          echo "PWA export validation passed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: PomodoroTimer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
