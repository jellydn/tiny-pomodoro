name: Setup build environment
description: Install Node/Bun and dependencies, and install the EAS CLI. Shared by all build workflows. Callers are responsible for actions/checkout before using this action (local composite actions cannot load without the repo on disk).

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      run: |
        # Composite actions cannot use `working-directory`, so cd explicitly.
        cd PomodoroTimer
        bun install

    - name: Setup EAS CLI
      shell: bash
      run: |
        cd PomodoroTimer
        bun add -g eas-cli
